name: Production health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.agendita.cl' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OWNER_ANALYTICS_MONITOR_EXPECTED: ${{ vars.OWNER_ANALYTICS_MONITOR_EXPECTED || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check public and protected production health
        run: node scripts/check-production-health.cjs
